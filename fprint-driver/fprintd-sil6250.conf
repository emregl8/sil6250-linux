# systemd drop-in that auto-binds the SIL6250 under fprintd.
#
# The mailbox /dev/sil6250 is neither hidraw nor spidev, so libfprint's udev
# backend cannot enumerate it; the driver instead registers as a virtual-type
# device keyed on the FP_SIL6250 environment variable (its value is the device
# node path).  fprintd is D-Bus/socket-activated, so exporting the variable in
# its service environment is what makes the device appear automatically: as soon
# as anything (gnome-control-center, `fprintd-enroll`, PAM) wakes fprintd, the
# virtual device is discovered.
#
# A udev ENV{} assignment on the node would NOT work here: it sets a property on
# the device, not the process environment of the fprintd daemon.
#
# LD_LIBRARY_PATH: the distro fprintd is linked against the system
# /usr/lib/libfprint-2.so, which has no sil6250 driver.  Our patched libfprint
# installs under the build PREFIX (default /usr/local), so we prepend that
# libdir to the loader search path to make fprintd pick up the driver-enabled
# build.  install.sh rewrites this line for the actual PREFIX/libdir; the value
# below is the default-prefix fallback.
#
# Install:
#   sudo install -Dm644 fprintd-sil6250.conf \
#       /etc/systemd/system/fprintd.service.d/10-sil6250.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart fprintd     # or just let it re-activate on demand

# DeviceAllow: fprintd's unit ships a DeviceAllow= whitelist (usb/spi/hidraw/
# cros_fp), which flips its device cgroup to closed.  /dev/sil6250 is a misc
# char device (major 10) not on that list, so without this line open() returns
# EPERM.  DeviceAllow= is additive across drop-ins, so this just appends ours.

[Service]
Environment=FP_SIL6250=/dev/sil6250
Environment=LD_LIBRARY_PATH=/usr/local/lib:/usr/local/lib64
DeviceAllow=/dev/sil6250 rw
