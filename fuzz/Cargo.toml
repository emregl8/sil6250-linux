[package]
name = "sil6250-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sil6250 = { path = "../sil6250" }
sil6250-ffi = { path = "../sil6250-ffi", features = ["fuzzing"] }

[workspace]
members = ["."]

[[bin]]
name = "parsers"
path = "fuzz_targets/parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gallery"
path = "fuzz_targets/gallery.rs"
test = false
doc = false
bench = false

[[bin]]
name = "images"
path = "fuzz_targets/images.rs"
test = false
doc = false
bench = false
